  # ==================================================================== Layout-reasoning calls (added 2026-11-15)
  # The caller never gives a room number, a room name the building has, or a tenant: the
  # true room can only be reached by reasoning over the layout (which rooms open onto which
  # corridor and in what order, room size on the floor, corner / end-of-hall position,
  # distance to stairs and elevators, position relative to an anchor room). Each comment
  # says why the true room is the answer; the facts were computed from the building files
  # (polygons within 0.6 m of a corridor, order along the corridor's long axis, area rank
  # among non-circulation rooms on the floor, floor bounding box). `added: true` keeps them
  # out of the "original calls" table.

  # ------------------------------------------------------------------ ptc-100
  # Largest room on floor 3: Suite 310 is 112 m2; the three open offices are 98 m2 each.
  # It sits at the west end of the north corridor, 2 m from Stair A (west).
  - id: layout-ptc-biggest-room-3
    building: ptc-100
    true_room: f3-suite-vacant
    tags: [layout, size, floor_plus_layout]
    added: true
    turns:
      - {speaker: dispatcher, text: "What floor are you on?"}
      - {speaker: caller, text: "third floor"}
      - {speaker: dispatcher, text: "Okay, where on the third floor?"}
      - {speaker: caller, text: "it's the biggest room up here, like the hugest space on the whole floor, down the end by the stairs"}

  # Coming out of Stair B (east) on floor 4 and walking west along the south corridor, the
  # left side is the south side. South-side doors in order from the stair: Executive Office
  # 404 (corner, x 38-44), then Executive Office 403 (x 33-38), then the Executive
  # Assistants open office. Second door on the left = 403; only 404 is a near miss.
  - id: layout-ptc-second-door-left
    building: ptc-100
    true_room: f4-office-403
    tags: [layout, door_order, near_stairs, floor_plus_layout]
    added: true
    live: true
    turns:
      - {speaker: dispatcher, text: "Where are you in the building?"}
      - {speaker: caller, text: "top floor. I came out of the east stair well and went down the hall, it's the second door on the left"}
      - {speaker: dispatcher, text: "The second door, not the first?"}
      - {speaker: caller, text: "yeah the first one is the corner office, we're the one right after it"}

  # Floor 2 corner rooms: Office 201 (SW, street), Open Office 2 North-West (NW, parking
  # lot), Conference 2N (NE, parking lot), Conference 2S (SE, street). Corner + street
  # view + east stairs outside the door leaves only Conference Room 2S.
  - id: layout-ptc-corner-street-east
    building: ptc-100
    true_room: f2-conference-s
    tags: [layout, corner, near_stairs, floor_plus_layout]
    added: true
    turns:
      - {speaker: dispatcher, text: "Tell me where you are."}
      - {speaker: caller, text: "second floor, im in a corner room, windows on two sides"}
      - {speaker: dispatcher, text: "What can you see out the windows?"}
      - {speaker: caller, text: "the street, and when you go out the door the stairs are right there, the ones on the east end"}

  # Floor 4 north corridor, walking east from the Executive Lounge: Restroom (North) is the
  # next door, then the Records Room, then Executive Office 406 at the corner. Records Room
  # and 406 both face Stair B across the corridor; Records has no windows, 406 does.
  - id: layout-ptc-two-past-lounge
    building: ptc-100
    true_room: f4-storage-records
    tags: [layout, door_order, anchor, near_stairs]
    added: true
    turns:
      - {speaker: dispatcher, text: "Where are you?"}
      - {speaker: caller, text: "up on four, the parking lot side. Its two doors past the lounge, kind of across from the stairs"}
