# Free-form test calls for the interpreter evaluation (eval/run_agent_eval.py).
#
# Callers here talk the way people do, not in vocabulary phrases: unit numbers, tenant
# names, door signs, relative position, corrections, yes / no answers, speech-recognition
# noise, and calls with no usable location at all (no_info: true, where the right output
# is no location evidence; facts such as "he's not breathing" are fine).
#
# Fields per call
#   id          unique name
#   building    building id (ptc-100 = synthetic office; the rest are data/processed/*.building.json)
#   true_room   room id where the caller actually is (must exist in the building)
#   tags        what the call exercises (free text, used only for reading the results)
#   no_info     true when nothing said narrows the location
#   live        true for the small representative subset the live check runs on
#   turns       dispatcher / caller turns in order. A dispatcher turn may carry
#               `question: {clue_type, value}`: the question was logged from the console
#               (the Yes / No / Not sure workflow); without it a question is plain text.
#
# The true rooms were picked from the building files, not from parser output.

calls:
  # ------------------------------------------------------------------ ptc-100 (synthetic, no suite records)
  - id: ptc-office-number
    building: ptc-100
    true_room: f3-office-303
    tags: [unit_number, room_name]
    turns:
      - {speaker: dispatcher, text: "911, what's the address of your emergency?"}
      - {speaker: caller, text: "100 Princeton Tech Center, I'm in office 303"}

  - id: ptc-door-sign
