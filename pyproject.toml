[project]
name = "caller-location-predictor"
version = "0.1.0"
description = "911 Caller Location Predictor - Bayesian indoor room posterior + search planning (v0, synthetic data)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=2.0",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pillow>=13.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "eval", "ingest", "ingest.mp3d", "parser", "planning", "sim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
