# Buildings traced by hand from a published floor plan.
# Built by `uv run python -m ingest.unified plan:<id>` (see ingest/unified/plan.py).
#
# Every `box` / `poly` is in the pixels of that level's plan image (x right, y down), read
# off a 10 px grid laid over the image. `frame` maps a level's image onto the reference
# image (the level whose frame is the identity): ref = scale * px + (dx, dy). The plan
# images of one building are separate crops at slightly different scales; the frames were
# fitted by correlating the wall linework of each level with the reference level.
#
# Space fields
#   id        unique in the building
#   name      what a caller or a sign would call it
#   type      a room type of configs/clue_vocab.yaml, or corridor | stairwell | elevator |
#             lobby | suite (a department's offices, interior not traced room by room)
#   box       [x0, y0, x1, y1]          poly  [[x, y], ...]
#   windows   plan sides with glass, letters of N S E W (N = top of the plan image)
#   tenant    the department that occupies it
#   shaft     stairs / elevators: the same value on every level the shaft serves
#   in        a small room inside a larger space: the space it opens into
#   doors     ids it has a door to (default: the corridors and lobbies it touches)
#   circulation: true   a room people walk through (links like a corridor)
#   capacity, owner     from the guide's room matrix
#
# Names: a number in a name is read as the label on that room's door ("Room A17"), so only
# the room itself carries it. A corridor beside A17 is not called "corridor by A17".
version: 1

buildings:
  - id: jrr-princeton
    name: Julis Romo Rabinowitz Building and Louis A. Simpson International Building
    address: 20 Washington Road, Princeton, NJ 08544
    use_type: office
    source: >-
      Floor plans on pages 24 to 28 of the Princeton University user guide for the two
      buildings (version 1.1, December 2016); room data from its room matrix (pages 22, 23)
    # 0.149 m per reference pixel: fitted, with the rotation, to the building outline in
    # OpenStreetMap (ways 1086964029 and 1086964030) at the nine corners below. Residual 0.4 m.
    metres_per_px: 0.14923
    origin_px: [430, 270]        # reference-image pixel that becomes model (0, 0)
    storey_height_m: 4.0         # assumed; the guide gives no heights
    georeference:
      control_points:            # reference-image pixel <-> OpenStreetMap outline corner
        - {px: [101, 20], latlng: [40.3492811, -74.6559643]}    # north tower, north-west corner
        - {px: [281, 20], latlng: [40.3494095, -74.6556932]}    # north tower, north-east corner
        - {px: [101, 518], latlng: [40.3487053, -74.6555082]}   # south tower, south-west corner
        - {px: [281, 518], latlng: [40.3488328, -74.6552335]}   # south tower, south-east corner
        - {px: [495, 43], latlng: [40.3495299, -74.6553514]}    # east wing, north-east corner
        - {px: [495, 497], latlng: [40.3490044, -74.6549353]}   # east wing, south-east corner
        - {px: [750, 165], latlng: [40.3495640, -74.6548622]}   # Simpson, north-east corner
        - {px: [750, 515], latlng: [40.3491616, -74.6545440]}   # Simpson, south-east corner
        - {px: [622, 165], latlng: [40.3494769, -74.6550520]}   # Simpson, north stair tower
    # A public Matterport tour of part of the building. Its geometry is not available to the
    # Model API token (the scan belongs to another account), so it is only shown, not measured.
    matterport:
      model_id: 6sd6A5r5EVp
      name: Economics Forum (Matterport tour, November 2026)
      covers: ["1-forum", "117", "1-forum-stair", "1-cor-n", "1-cor-s", "217", "2-forum-bridge"]
