      - {id: ent-scudder, name: Atrium entrance on Scudder Plaza (Level 1), space: "171", level: "1", px: [557, 485], outward: S}
      - {id: ent-north, name: North entrance facing Hoyt Laboratory (A level), space: a-vest-n, level: A, px: [640, 165], outward: N}
    notes:
      - "Traced from the floor plans in the university's 2016 user guide: room outlines are good to about a metre, and anything changed in the building since 2016 is not shown."
      - "Department areas are single spaces; the individual offices inside them are not in the guide."
      - "Storey heights are assumed (4 m per level). Doors are placed where a room meets a corridor on the plan, not surveyed."
      - "Entrances are approximate. The guide also shows doors on the A level under the International Atrium and a tunnel to Hoyt Laboratory on the B level; neither is modelled as an entrance."
      - "Under the Julis Romo Rabinowitz Building the B level is foundations and plant space with no rooms in the guide; it is left out."
      - "A caller who says 'ground floor' may mean Level 1 (Washington Road) or the A level (campus level); floor names here are the building's own: B, A, 1, 2, 3."

